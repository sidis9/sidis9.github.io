<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #f0eee9; overflow: hidden; }
  #root { width: 100%; height: 100%; }
  .dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}
  .dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}
  [data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}
  [data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}
  [data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}
  .dc-card{transition:box-shadow .15s,transform .15s}
  .dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}
  .dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}
  .dc-grip:hover{background:rgba(0,0,0,.08)}
  .dc-grip:active{cursor:grabbing}
  .dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}
  .dc-labeltext:hover{background:rgba(0,0,0,.05)}
  .dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}
  .dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}
  [data-dc-slot]:hover .dc-expand{opacity:1}
</style>

<body>
<div id="root"></div>
<script type="text/babel">

/* ── Design Canvas ───────────────────────────────────── */
const DC = {
  bg: '#f0eee9', grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)', title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)', font: '-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif',
};
const DCCtx = React.createContext(null);

function DesignCanvas({ children, minScale = 0.1, maxScale = 8 }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  const [ready, setReady] = React.useState(false);
  React.useEffect(() => { setTimeout(() => setReady(true), 50); }, []);

  const registry = {};
  const sectionMeta = {};
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter(k => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter(k => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state, section: id => state.sections[id] || {},
    patchSection: (id, p) => setState(s => ({
      ...s, sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: slotId => setState(s => ({ ...s, focus: slotId })),
  }), [state]);

  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = e => { const ae = document.activeElement; if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur(); };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => { document.removeEventListener('keydown', onKey); document.removeEventListener('pointerdown', onPd, true); };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

function DCViewport({ children, minScale = 0.1, maxScale = 8 }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 60, y: 60, scale: 0.55 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    if (worldRef.current) worldRef.current.style.transform = `translate3d(${x}px,${y}px,0) scale(${scale})`;
  }, []);

  React.useEffect(() => { apply(); }, [apply]);

  React.useEffect(() => {
    const vp = vpRef.current; if (!vp) return;
    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top, t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      t.x = px - (px - t.x) * k; t.y = py - (py - t.y) * k; t.scale = next; apply();
    };
    const isMouseWheel = e => e.deltaMode !== 0 || (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);
    let isGesturing = false;
    const onWheel = e => {
      e.preventDefault();
      if (isGesturing) return;
      if (e.ctrlKey) { zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01)); }
      else if (isMouseWheel(e)) { zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18)); }
      else { tf.current.x -= e.deltaX; tf.current.y -= e.deltaY; apply(); }
    };
    let gsBase = 1;
    const onGS = e => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGC = e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale); };
    const onGE = e => { e.preventDefault(); isGesturing = false; };
    let drag = null;
    const onPD = e => {
      const onBg = !e.target.closest('[data-dc-slot],.dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault(); vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY }; vp.style.cursor = 'grabbing';
    };
    const onPM = e => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx; tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY; apply();
    };
    const onPU = e => { if (!drag || e.pointerId !== drag.id) return; vp.releasePointerCapture(e.pointerId); drag = null; vp.style.cursor = ''; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGS, { passive: false });
    vp.addEventListener('gesturechange', onGC, { passive: false });
    vp.addEventListener('gestureend', onGE, { passive: false });
    vp.addEventListener('pointerdown', onPD);
    vp.addEventListener('pointermove', onPM);
    vp.addEventListener('pointerup', onPU);
    vp.addEventListener('pointercancel', onPU);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGS);
      vp.removeEventListener('gesturechange', onGC);
      vp.removeEventListener('gestureend', onGE);
      vp.removeEventListener('pointerdown', onPD);
      vp.removeEventListener('pointermove', onPM);
      vp.removeEventListener('pointerup', onPU);
      vp.removeEventListener('pointercancel', onPU);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} style={{ height:'100vh',width:'100vw',background:DC.bg,overflow:'hidden',overscrollBehavior:'none',touchAction:'none',position:'relative',fontFamily:DC.font }}>
      <div ref={worldRef} style={{ position:'absolute',top:0,left:0,transformOrigin:'0 0',willChange:'transform',width:'max-content',minWidth:'100%',minHeight:'100%',padding:'60px 0 80px' }}>
        <div style={{ position:'absolute',inset:-6000,backgroundImage:gridSvg,backgroundSize:'120px 120px',pointerEvents:'none',zIndex:-1 }} />
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter(c => c && c.type === DCArtboard);
  const srcOrder = artboards.map(a => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};
  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter(k => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter(k => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);
  const byId = Object.fromEntries(artboards.map(a => [a.props.id ?? a.props.label, a]));
  return (
    <div data-dc-section={sid} style={{ marginBottom:80, position:'relative' }}>
      <div style={{ padding:'0 60px 56px' }}>
        <div className="dc-editable" contentEditable suppressContentEditableWarning
          onBlur={e => ctx && sid && ctx.patchSection(sid, { title: e.currentTarget.textContent })}
          style={{ fontSize:28,fontWeight:600,color:DC.title,letterSpacing:-0.4,marginBottom:6,display:'inline-block' }}>{sec.title ?? title}</div>
        {subtitle && <div style={{ fontSize:16,color:DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display:'flex',gap,padding:'0 60px',alignItems:'flex-start',width:'max-content' }}>
        {order.map(k => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={v => ctx && ctx.patchSection(sid, x => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={next => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
    </div>
  );
}

function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);
  const onGripDown = e => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map(el => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map(h => h.x);
    const startIdx = order.indexOf(id); const startX = e.clientX; let liveOrder = order.slice();
    me.classList.add('dc-dragging');
    const layout = () => { for (const h of homes) { if (h.id === id) continue; const slot = liveOrder.indexOf(h.id); h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`; } };
    const move = ev => {
      const dx = ev.clientX - startX; me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx; let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) { const d = Math.abs(slotXs[i] - cur); if (d < best) { best = d; nearest = i; } }
      if (liveOrder.indexOf(id) !== nearest) { liveOrder = order.filter(k => k !== id); liveOrder.splice(nearest, 0, id); layout(); }
    };
    const up = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging'); me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      setTimeout(() => { for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; } if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder); requestAnimationFrame(() => requestAnimationFrame(() => { for (const h of homes) h.el.style.transition = ''; })); }, 180);
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
  };
  return (
    <div ref={ref} data-dc-slot={id} style={{ position:'relative',flexShrink:0 }}>
      <div className="dc-labelrow" style={{ position:'absolute',bottom:'100%',left:-4,marginBottom:4,color:DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown}>
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus}>
          <div className="dc-editable" contentEditable suppressContentEditableWarning
            onPointerDown={e => e.stopPropagation()}
            onBlur={e => onRename && onRename(e.currentTarget.textContent)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
            style={{ fontSize:15,fontWeight:500,color:DC.label,lineHeight:1 }}>{label}</div>
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={e => e.stopPropagation()}>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card" style={{ borderRadius:2,boxShadow:'0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)',overflow:'hidden',width,height,background:'#fff',...style }}>
        {children}
      </div>
    </div>
  );
}

function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);
  const go = d => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = d => { const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length]; const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0]; if (first) ctx.setFocus(`${ns}/${first}`); };
  React.useEffect(() => {
    const k = e => { if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); } if (e.key === 'ArrowRight') { e.preventDefault(); go(1); } };
    document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k);
  });
  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 1));
  const Arrow = ({ dir, onClick }) => (
    <button onClick={e => { e.stopPropagation(); onClick(); }}
      style={{ position:'absolute',top:'50%',[dir]:28,transform:'translateY(-50%)',border:'none',background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.9)',width:44,height:44,borderRadius:22,fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center' }}
      onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,.18)'}
      onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,.08)'}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)} style={{ position:'fixed',inset:0,zIndex:100,background:'rgba(24,20,16,.6)',backdropFilter:'blur(14px)',fontFamily:DC.font,color:'#fff' }}>
      <div onClick={e => e.stopPropagation()} style={{ position:'absolute',top:0,left:0,right:0,height:72,display:'flex',alignItems:'flex-start',padding:'16px 20px 0',gap:16 }}>
        <span style={{ fontSize:18,fontWeight:600,letterSpacing:-0.3,padding:'6px 8px' }}>{meta.title}</span>
        <div style={{ flex:1 }} />
        <button onClick={() => ctx.setFocus(null)} style={{ border:'none',background:'transparent',color:'rgba(255,255,255,.7)',width:32,height:32,borderRadius:16,fontSize:20,cursor:'pointer',lineHeight:1 }}>×</button>
      </div>
      <div style={{ position:'absolute',top:64,bottom:56,left:100,right:100,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16 }}>
        <div onClick={e => e.stopPropagation()} style={{ width:width*scale,height:height*scale,position:'relative' }}>
          <div style={{ width,height,transform:`scale(${scale})`,transformOrigin:'top left',background:'#fff',borderRadius:2,overflow:'hidden',boxShadow:'0 20px 80px rgba(0,0,0,.4)' }}>
            {children}
          </div>
        </div>
        <div onClick={e => e.stopPropagation()} style={{ fontSize:14,fontWeight:500,opacity:.85,textAlign:'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity:.5,marginLeft:10 }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>
      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />
      <div onClick={e => e.stopPropagation()} style={{ position:'absolute',bottom:20,left:'50%',transform:'translateX(-50%)',display:'flex',gap:8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border:'none',padding:0,cursor:'pointer',width:6,height:6,borderRadius:3,background:i===idx?'#fff':'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body
  );
}

      <section style={{ padding:"72px 60px" }}>
        <SectionHead3 num="04" title="Experience" />
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:60 }}>
          {EXPERIENCE.map(exp => (
            <div key={exp.company}>
              <div style={{ fontSize:20, fontWeight:500, color:"#18181a", marginBottom:6, lineHeight:1.3 }}>{exp.role}</div>
              <div style={{ fontSize:13, color:amber, marginBottom:20, fontFamily:"'DM Mono',monospace", letterSpacing:"0.04em" }}>{exp.company} · {exp.period}</div>
              {exp.bullets.map(b => (
                <div key={b} style={{ fontSize:14, color:"#666", marginBottom:10, paddingLeft:18, position:"relative", lineHeight:1.6 }}>
                  <span style={{ position:"absolute", left:0, color:amber }}>·</span>{b}
                </div>
              ))}
            </div>
          ))}
        </div>
      </section>
      <div style={{ height:1, background:"#ebebeb", margin:"0 60px" }}></div>
      {/* Education */}
      <section style={{ padding:"72px 60px" }}>
        <SectionHead3 num="05" title="Education" />
        {EDUCATION.map(e => (
          <div key={e.school}>
            <div style={{ fontSize:17, fontWeight:500, color:"#18181a", marginBottom:6 }}>{e.degree}</div>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:12, color:amber, letterSpacing:"0.04em" }}>{e.school} · {e.year}</div>
          </div>
        ))}
      </section>
      <div style={{ height:1, background:"#ebebeb", margin:"0 60px" }}></div>
      {/* Contact */}
      <section style={{ padding:"72px 60px" }}>
        <SectionHead3 num="06" title="Contact" />
        <div style={{ display:"flex", gap:64, alignItems:"flex-start", flexWrap:"wrap" }}>
          <p style={{ fontSize:18, fontWeight:300, color:"#444", maxWidth:360, lineHeight:1.7, flex:"1 1 300px" }}>Open to full-time and contract roles in analytics, growth, and BI. Best reached by email.</p>
          <div style={{ display:"flex", flexDirection:"column", gap:14, flex:"1 1 200px" }}>
            {[{l:"Email",v:"hello@jordanmercer.co"},{l:"LinkedIn",v:"linkedin.com/in/jordanmercer"},{l:"GitHub",v:"github.com/jmercer"}].map(c => (
              <a key={c.l} href="#" style={{ display:"flex", alignItems:"center", gap:12, textDecoration:"none" }}>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:10, color:"#bbb", letterSpacing:"0.1em", textTransform:"uppercase", width:64 }}>{c.l}</span>
                <span style={{ fontSize:14, color:"#18181a", borderBottom:`1px solid ${amber}`, paddingBottom:1 }}>{c.v}</span>
              </a>
            ))}
          </div>
        </div>
      </section>
      <footer style={{ padding:"20px 60px", borderTop:"1px solid #ebebeb", display:"flex", justifyContent:"space-between" }}>
        <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:"#ccc" }}>Jordan Mercer · {new Date().getFullYear()}</span>
        <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:"#ccc" }}>Marketing &amp; BI Analyst</span>
      </footer>
    </div>
  );
}
function SectionHead3({ num, title }) {
  return (
    <div style={{ display:"flex", alignItems:"baseline", gap:16, marginBottom:40 }}>
      <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:"#ccc" }}>{num}</span>
      <span style={{ fontSize:13, fontWeight:600, color:"#18181a", letterSpacing:"0.06em", textTransform:"uppercase" }}>{title}</span>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────── */
function App() {
  return (
    <DesignCanvas>
      <DCSection id="s1" title="Direction 1 — Data Room">
        <DCArtboard id="a1" label="Dark · Mono accents · Terminal feel" width={1280} height={2800}>
          <Dir1 />
        </DCArtboard>
      </DCSection>
      <DCSection id="s2" title="Direction 2 — Editorial">
        <DCArtboard id="a2" label="Off-white · Playfair serif · Newspaper layout" width={1280} height={3100}>
          <Dir2 />
        </DCArtboard>
      </DCSection>
      <DCSection id="s3" title="Direction 3 — Signal">
        <DCArtboard id="a3" label="White · Amber accent · Clean & confident" width={1280} height={2900}>
          <Dir3 />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
