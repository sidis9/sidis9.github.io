<style>
/* ─── Reset & Tokens ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #ffffff;
  --surface:   #f7f7f6;
  --border:    #e8e8e6;
  --border-md: #d4d4d0;
  --text:      #111110;
  --text-2:    #6b6b68;
  --text-3:    #a8a8a4;
  --accent:    #c8842a;      /* warm amber — hover + live CTA only */
  --accent-bg: #fdf5e8;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-display: 'Syne', system-ui, sans-serif;
  --r:         4px;
  --max:       760px;        /* tight prose width — feels intentional */
  --max-wide:  1060px;
}

html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
button { font-family: var(--font-sans); cursor: pointer; border: none; background: none; }
ul { list-style: none; }

/* ─── Layout ─────────────────────────────────────────────── */
.container {
  max-width: var(--max-wide);
  margin: 0 auto;
  padding: 0 24px;
}
.container--narrow { max-width: var(--max); }

/* ─── Nav ────────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav__inner {
  max-width: var(--max-wide);
  margin: 0 auto;
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.nav__name {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.nav__links {
  display: flex;
  gap: 4px;
}
.nav__link {
  font-size: 13px;
  color: var(--text-2);
  padding: 6px 10px;
  border-radius: var(--r);
  transition: color 0.12s, background 0.12s;
}
.nav__link:hover { color: var(--text); background: var(--surface); }
.nav__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ─── Hero ───────────────────────────────────────────────── */
.hero {
  padding: 80px 0 72px;
  border-bottom: 1px solid var(--border);
}
.hero__name {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 80px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.0;
  color: var(--text);
  margin-bottom: 18px;
}
.hero__role {
  font-size: 15px;
  color: var(--text-2);
  margin-bottom: 24px;
  font-weight: 400;
}
.hero__tagline {
  font-size: 18px;
  font-weight: 300;
  color: var(--text-2);
  line-height: 1.72;
  max-width: 580px;
  margin-bottom: 36px;
}
.hero__links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.hero__link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
  border: 1px solid var(--border-md);
  padding: 7px 14px;
  border-radius: var(--r);
  transition: color 0.12s, border-color 0.12s, background 0.12s;
}
.hero__link:hover { color: var(--text); border-color: var(--text); background: var(--surface); }
.hero__link--accent {
  color: var(--accent);
  border-color: var(--accent);
}
.hero__link--accent:hover { background: var(--accent-bg); }

/* ─── Section scaffold ───────────────────────────────────── */
.section {
  padding: 72px 0;
  border-bottom: 1px solid var(--border);
}
.section:last-child { border-bottom: none; }
.section__header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 40px;
}
.section__num {
  font-family: 'Inter', monospace;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.section__title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ─── About ──────────────────────────────────────────────── */
.about__text {
  font-size: 17px;
  font-weight: 300;
  color: #444;
  line-height: 1.8;
  max-width: 640px;
}

/* ─── Projects ───────────────────────────────────────────── */
.projects__list {
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}

/* Hero project — spans full width, accent tint */
.project-card {
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  transition: background 0.1s;
}
.project-card:last-child { border-bottom: none; }
.project-card--hero {
  background: var(--accent-bg);
  border-bottom: 1px solid #edd9b8;
}
.project-card--hero:hover { background: #faefd6; }
.project-card:not(.project-card--hero):hover { background: var(--surface); }

.project-card__summary {
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px 24px;
  align-items: start;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.project-card__left { min-width: 0; }
.project-card__meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.project-card__live-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.04em;
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.project-card__title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.3;
}
.project-card--hero .project-card__title { font-size: 18px; }
.project-card__subtitle {
  font-size: 12px;
  color: var(--text-3);
  font-weight: 400;
  margin-bottom: 10px;
  line-height: 1.5;
}
.project-card__desc {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.65;
  max-width: 600px;
}
.project-card__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.tag {
  font-size: 11px;
  color: var(--text-3);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 2px;
  font-weight: 400;
  letter-spacing: 0.02em;
}
.project-card--hero .tag {
  color: var(--accent);
  border-color: #edd9b8;
  background: rgba(200,132,42,0.06);
}
.project-card__chevron {
  color: var(--text-3);
  flex-shrink: 0;
  margin-top: 2px;
  transition: transform 0.18s;
}
.project-card__chevron--open { transform: rotate(180deg); }

/* Expanded detail panel */
.project-card__detail {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1);
}
.project-card__detail--open {
  max-height: 600px;
}
.project-card__detail-inner {
  padding: 0 28px 28px;
  border-top: 1px solid var(--border);
  margin-top: 0;
}
.project-card--hero .project-card__detail-inner {
  border-top-color: #edd9b8;
}
.detail-section-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin: 20px 0 10px;
}
.result-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.result-list__item {
  display: grid;
  grid-template-columns: 14px 1fr;
  gap: 8px;
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.55;
  align-items: start;
}
.result-list__item::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 7px;
  flex-shrink: 0;
}
.project-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.project-card--hero .project-card__actions { border-top-color: #edd9b8; }
.action-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: var(--r);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.action-link--primary {
  background: var(--accent);
  color: #fff;
}
.action-link--primary:hover { background: #a86e20; }
.action-link--secondary {
  color: var(--text-2);
  border: 1px solid var(--border-md);
}
.action-link--secondary:hover { background: var(--surface); color: var(--text); border-color: var(--text); }

/* ─── Skills ─────────────────────────────────────────────── */
.skills__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}
.skill-group__cat {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.skill-group__item {
  font-size: 14px;
  color: var(--text-2);
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.4;
}
.skill-group__item:last-child { border-bottom: none; }

/* ─── Experience ─────────────────────────────────────────── */
.exp__list { display: flex; flex-direction: column; gap: 48px; }
.exp__role {
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.3;
}
.exp__meta {
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 18px;
  font-weight: 400;
}
.exp__bullet {
  display: grid;
  grid-template-columns: 14px 1fr;
  gap: 8px;
  font-size: 14px;
  color: var(--text-2);
  margin-bottom: 9px;
  line-height: 1.55;
  align-items: start;
}
.exp__bullet::before {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--border-md);
  margin-top: 8px;
  flex-shrink: 0;
}

/* ─── Education ──────────────────────────────────────────── */
.edu__list { display: flex; flex-direction: column; gap: 24px; }
.edu__degree {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 4px;
}
.edu__meta {
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 2px;
}
.edu__note {
  font-size: 13px;
  color: var(--text-3);
}

/* ─── Contact ────────────────────────────────────────────── */
.contact__wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: start;
}
.contact__note {
  font-size: 17px;
  font-weight: 300;
  color: var(--text-2);
  line-height: 1.75;
}
.contact__links { display: flex; flex-direction: column; gap: 12px; }
.contact__item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  transition: color 0.1s;
}
.contact__item:hover .contact__val { color: var(--accent); }
.contact__label {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  width: 72px;
  flex-shrink: 0;
}
.contact__val {
  font-size: 14px;
  color: var(--text);
  transition: color 0.12s;
}

/* ─── Footer ─────────────────────────────────────────────── */
.footer {
  padding: 20px 0;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer__text {
  font-size: 12px;
  color: var(--text-3);
}

/* ─── Mobile ─────────────────────────────────────────────── */
@media (max-width: 700px) {
  .nav__links { display: none; }
  .hero { padding: 56px 0 48px; }
  .hero__name { letter-spacing: -0.025em; }
  .hero__tagline { font-size: 16px; }
  .section { padding: 52px 0; }
  .skills__grid { grid-template-columns: 1fr; gap: 32px; }
  .contact__wrap { grid-template-columns: 1fr; gap: 32px; }
  .project-card__summary { grid-template-columns: 1fr auto; }
  .project-card__detail-inner { padding: 0 20px 20px; }
  .project-card__summary { padding: 20px; }
  .footer { flex-direction: column; gap: 4px; text-align: center; }
}
@media (max-width: 480px) {
  .container { padding: 0 16px; }
  .hero__links { gap: 8px; }
}

/* ─── Scroll anchors ─────────────────────────────────────── */
[id] { scroll-margin-top: 64px; }

/* ─── Print styles ───────────────────────────────────────── */
@media print {
  @page { size: letter portrait; margin: 1.8cm 2cm; }

  /* Remove nav */
  .nav { display: none !important; }

  /* Remove sticky, allow full flow */
  body { min-height: unset; }
  html { font-size: 14px; }

  /* Force colors */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Sections flow naturally, soft page break before each */
  .section {
    break-inside: avoid-page;
    padding: 32px 0;
    border-bottom: 1px solid var(--border) !important;
  }
  .hero { padding: 40px 0 32px; }

  /* Kill accordion — show all project detail panels open */
  .project-card__detail {
    max-height: none !important;
    overflow: visible !important;
  }
  .project-card__detail-inner { display: block !important; }
  .project-card__chevron { display: none !important; }
  .project-card__summary { cursor: default; }

  /* Each project card stays together */
  .project-card { break-inside: avoid; }

  /* Kill hover/interactive states */
  .nav__link, .hero__link, .action-link { box-shadow: none; }

  /* Keep colors and backgrounds */
  .project-card--hero { background: var(--accent-bg) !important; }

  /* Skills grid — 3 col on paper */
  .skills__grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }

  /* Contact — single col on print */
  .contact__wrap { grid-template-columns: 1fr; gap: 20px; }

  /* Footer */
  .footer { padding: 16px 0; }

  /* Page break before major sections */
  #projects { break-before: page; }
  #skills    { break-before: page; }
  #contact   { break-before: avoid; }
}
</style>

<script>
(function() {

  function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    children.flat().forEach(c => c && e.append(typeof c === 'string' ? document.createTextNode(c) : c));
    return e;
  }
  function svgIcon(path, size=16) {
    const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width', size); s.setAttribute('height', size);
    s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('fill','none');
    s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','1.6');
    s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    s.innerHTML = path;
    return s;
  }
  const CHEVRON = '<path d="M3 6l5 5 5-5"/>';
  const ARROW_UP_RIGHT = '<path d="M3 13L13 3M13 3H6M13 3v7"/>';
  const DOWNLOAD = '<path d="M8 3v7M5 7l3 3 3-3M3 13h10"/>';
  const MAIL = '<rect x="2" y="4" width="12" height="9" rx="1"/><path d="M2 5l6 5 6-5"/>';

    detail.appendChild(detailInner);
    card.appendChild(detail);

      } else {
        openCards.add(p.id);
        detail.classList.add('project-card__detail--open');
        chevronIcon.classList.add('project-card__chevron--open');
        summary.setAttribute('aria-expanded', 'true');

    projectsList.appendChild(card);
